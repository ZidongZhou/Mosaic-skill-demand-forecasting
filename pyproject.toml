[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-skill-demand"
version = "1.0.0"
description = "Cross-scale skill-demand forecasting experiments"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["mosaic"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
